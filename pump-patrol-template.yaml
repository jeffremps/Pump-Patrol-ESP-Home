# base_pump_controller.yaml
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino
    advanced:
      flash_chip: generic
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

logger:

api:
  encryption:
    key: ${api_key}

ota:
  - platform: esphome
    encryption:
      key: ${ota_key} 

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: false
  output_power: 20.5

light:
  - platform: status_led
    name: "Status LED"
    pin: GPIO4
    restore_mode: ALWAYS_ON
    internal: True

switch:
  - platform: gpio
    pin: GPIO13  
    restore_mode: ALWAYS_OFF
    internal: True
    id: pump_running_led
    
  - platform: gpio
    pin: GPIO14  
    restore_mode: ALWAYS_OFF
    internal: True
    id: level_high_led

binary_sensor:
  - platform: gpio
    name: "Tank High"
    pin: 
      number: GPIO32
      inverted: true
      mode:
        input: true
        pullup: false
    filters:
      - delayed_on: 1s
      - delayed_off: 1s
    trigger_on_initial_state: True
    on_press:
      - switch.turn_on: level_high_led
    on_release:
      - switch.turn_off: level_high_led

  - platform: template
    name: "Pump State"
    icon: "mdi:pump"
    device_class: running  
    lambda: |-
      if (id(calibrated_pump_amps).state >= ${running_threshold}) {
        return true;
      } else {
        return false;
      }     

  - platform: gpio
    id: voltage_selector_pin
    pin:
      number: GPIO34
      inverted: true      
      mode:
        input: true
        pullup: false      
    internal: true        

sensor:
  - platform: wifi_signal
    name: "Wifi Strength"
    update_interval: 60s

  - platform: ct_clamp
    sensor: pump_raw_adc_pin
    id: calibrated_pump_amps  
    name: "Pump Current"
    update_interval: 1s
    sample_duration: 200ms
    filters:
      - calibrate_linear:
          - 0 -> 0
          - 0.323 -> 6.5
          - 0.495 -> 10
      - lambda: |-
          if (x < 0.1) {
            return 0.0;
          } else {
            return x;
          }
    on_value:
      then:
        - lambda: |-
            if (x >= ${running_threshold}) {
              id(pump_running_led).turn_on();
            } else if (x <= ${stopping_threshold}) {
              id(pump_running_led).turn_off();
            }

  - platform: adc
    pin: GPIO35
    id: pump_raw_adc_pin  
    attenuation: auto
    update_interval: 1s

  - platform: template
    name: "Voltage"
    id: current_voltage
    unit_of_measurement: "V"
    icon: "mdi:lightning-bolt"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (id(voltage_selector_pin).state) {
        return 240.0;     
      } else {
        return 120.0;     
      }

  - platform: template
    name: "Pump Watts"
    id: pump_power_watts
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: "mdi:flash"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      return id(calibrated_pump_amps).state * id(current_voltage).state;

button:
  - platform: restart
    name: "Restart"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
    mac_address:
      name: Mac Address
