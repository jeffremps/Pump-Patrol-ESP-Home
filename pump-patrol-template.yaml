substitutions:
  # Input 1
  input_1_internal: "false" # Changed from enabled to internal to fix parsing logic
  input_1_triggers_alert: "true"
  input_1_name: "Tank High"

  # Input 2
  input_2_internal: "true"
  input_2_triggers_alert: "false"
  input_2_name: "Input 2"
  
  # Input 3
  input_3_internal: "true"
  input_3_triggers_alert: "false"
  input_3_name: "Input 3"
  
  input_voltage: "120.0"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino
    advanced:
      flash_chip: generic
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

logger:

api:
  encryption:
    key: ${api_key}

ota:
  - platform: esphome
    encryption:
      key: ${ota_key} 

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: false
  output_power: 20.5

light:
  - platform: status_led
    name: "Status LED"
    pin: GPIO4
    restore_mode: ALWAYS_ON
    internal: True

switch:
  - platform: gpio
    pin: GPIO13  
    restore_mode: ALWAYS_OFF
    internal: True
    id: pump_running_led
    
  - platform: gpio
    pin: GPIO14  
    restore_mode: ALWAYS_OFF
    internal: True
    id: alert_led

binary_sensor:
  # Input 1 (GPIO 32)
  - platform: gpio
    name: ${input_1_name}
    internal: ${input_1_internal}
    id: input_1_pin
    pin: 
      number: GPIO32
      inverted: true
      mode:
        input: true
        pullup: false
    filters:
      - delayed_on: 1s
      - delayed_off: 1s
    trigger_on_initial_state: True
    on_press:
      - if:
          condition:
            - lambda: 'return ${input_1_triggers_alert};'
          then:
            - switch.turn_on: alert_led
    on_release:
      - if:
          condition:
            # Smart Clear: Only turn off the light if Input 1 is allowed to touch it AND no other alert pins are currently active
            - lambda: |-
                if (${input_1_triggers_alert}) {
                  bool other_alert_active = (id(input_2_pin).state && ${input_2_triggers_alert}) || (id(input_3_pin).state && ${input_3_triggers_alert});
                  return !other_alert_active; 
                }
                return false;
          then:
            - switch.turn_off: alert_led

  - platform: template
    name: "Pump State"
    icon: "mdi:pump"
    device_class: running
    update_interval: 1s
    lambda: |-
      if (id(calibrated_pump_amps).state >= ${running_threshold}) {
        return true;
      } else if (id(calibrated_pump_amps).state <= ${stopping_threshold}) {
        return false;
      }
      return {};

  # Input 2 (GPIO 33)
  - platform: gpio
    name: ${input_2_name}
    internal: ${input_2_internal}
    id: input_2_pin
    pin:
      number: GPIO33
      inverted: true
      mode:
        input: true
        pullup: false
    filters:
      - delayed_on: 1s
      - delayed_off: 1s
    trigger_on_initial_state: True
    on_press:
      - if:
          condition:
            - lambda: 'return ${input_2_triggers_alert};'
          then:
            - switch.turn_on: alert_led
    on_release:
      - if:
          condition:
            - lambda: |-
                if (${input_2_triggers_alert}) {
                  bool other_alert_active = (id(input_1_pin).state && ${input_1_triggers_alert}) || (id(input_3_pin).state && ${input_3_triggers_alert});
                  return !other_alert_active;
                }
                return false;
          then:
            - switch.turn_off: alert_led

  # Input 3 (GPIO 34)
  - platform: gpio
    name: ${input_3_name}
    internal: ${input_3_internal}
    id: input_3_pin
    pin:
      number: GPIO34
      inverted: true      
      mode:
        input: true
        pullup: false      
    filters:
      - delayed_on: 1s
      - delayed_off: 1s
    trigger_on_initial_state: True
    on_press:
      - if:
          condition:
            - lambda: 'return ${input_3_triggers_alert};'
          then:
            - switch.turn_on: alert_led
    on_release:
      - if:
          condition:
            - lambda: |-
                if (${input_3_triggers_alert}) {
                  bool other_alert_active = (id(input_1_pin).state && ${input_1_triggers_alert}) || (id(input_2_pin).state && ${input_2_triggers_alert});
                  return !other_alert_active;
                }
                return false;
          then:
            - switch.turn_off: alert_led

sensor:
  - platform: wifi_signal
    name: "Wifi Strength"
    update_interval: 60s

  - platform: ct_clamp
    sensor: pump_raw_adc_pin
    id: calibrated_pump_amps  
    name: "Pump Current"
    update_interval: 1s
    sample_duration: 200ms
    filters:
      - calibrate_linear:
          - 0 -> 0
          - 0.323 -> 6.5
          - 0.495 -> 10
      - lambda: |-
          if (x < 0.1) {
            return 0.0;
          } else {
            return x;
          }
    on_value:
      then:
        - lambda: |-
            if (x >= ${running_threshold}) {
              id(pump_running_led).turn_on();
            } else if (x <= ${stopping_threshold}) {
              id(pump_running_led).turn_off();
            }

  - platform: adc
    pin: GPIO35
    id: pump_raw_adc_pin  
    attenuation: auto
    update_interval: 1s

  - platform: template
    name: "Voltage"
    unit_of_measurement: "V"
    icon: "mdi:lightning-bolt"
    accuracy_decimals: 0
    update_interval: 1h
    lambda: |-
      return ${input_voltage};

  - platform: template
    name: "Pump Watts"
    id: pump_power_watts
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: "mdi:flash"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      return id(calibrated_pump_amps).state * ${input_voltage};

button:
  - platform: restart
    name: "Restart"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
    mac_address:
      name: Mac Address
